<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIMA STORE</title>
<style>
body{margin:0;background:#020713;color:#fff;font-family:Tahoma;text-align:center}
#splash{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center}
#splash img{width:100%;height:100%;object-fit:contain}
.box{margin:80px auto;max-width:500px;background:#0a1a33;border:1px solid #08aaff;border-radius:20px;padding:25px}
.fw{font-size:32px;color:#00e5ff;font-weight:bold}
.badge{display:inline-block;margin-top:15px;padding:8px 18px;border-radius:10px;font-weight:bold}
.ok{background:#00c853;color:#000}
.no{background:#ff1744;color:#fff}
</style>
</head>
<body>

<div id="splash"><img src="36232974-D9AB-4479-99BD-912B9CD5122E.jpeg"></div>

<div class="box">
<div>مرحبا بك في HIMA STORE</div>
<br>
<div id="fw" class="fw">جاري كشف السوفت...</div>
<div id="msg"></div>
</div>

<script>
function getFW(){
  let ua = navigator.userAgent;
  let m = ua.match(/(\d+\.\d+)/);
  return m ? m[1] : "افتح من PS4";
}
const fw = getFW();
document.getElementById('fw').innerHTML = "السوفت: " + fw;
let num = parseFloat(fw);
let msgDiv = document.getElementById('msg');
if(!isNaN(num)){
  if(num <= 13.52){
    msgDiv.innerHTML = '<div class="badge ok">✅ مدعوم لحد 13.52</div>';
  } else {
    msgDiv.innerHTML = '<div class="badge no">❌ غير مدعوم</div>';
  }
}
setTimeout(()=>{ document.getElementById('splash').style.display='none'; },15000);
</script>

</body>
</html>
