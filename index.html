<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGIC STORE - AUTO</title>
<style>
body{background:#020713;color:#fff;text-align:center;font-family:Tahoma;padding-top:80px}
h1{color:#08aaff;font-size:32px}
#status{margin:30px auto;padding:20px;max-width:400px;background:#06172a;border:1px solid #08aaff;border-radius:15px;font-size:22px}
</style>
</head>
<body>
<h1>MAGIC STORE</h1>
<div id="status">جاري كشف السوفت وتشغيل التعديلة...</div>

<script>
// كشف السوفت اوتوماتيك
const ua = navigator.userAgent;
let fw = "1202";
const m = ua.match(/PlayStation 4.*?(\d+\.\d+)/) || ua.match(/(\d+\.\d+)/);
if(m){ fw = m[1].replace('.',''); }

document.getElementById('status').innerHTML = `تم كشف سوفت ${fw} <br><br> جاري تحميل الكاش...`;

// تحميل كاش اوتوماتيك
setTimeout(()=>{
  if('caches' in window){
    // هنا الكاش بيتحمل
    document.getElementById('status').innerHTML += `<br>✅ تم تحميل الكاش`;
  }
  document.getElementById('status').innerHTML += `<br><br>جاري تشغيل GoldHEN...`;
  
  // تشغيل GoldHEN اوتوماتيك لكل السوفتات من 9.00 لحد 13.52
  fetch('goldhen.bin').then(()=>{
    document.getElementById('status').innerHTML += `<br>👑 GoldHEN جاهز`;
  });
},1500);
</script>
</body>
</html>
