<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIMA STORE - AUTO</title>
<style>
body{background:#020713;color:#fff;text-align:center;font-family:Tahoma;padding-top:80px}
#status{margin:30px auto;padding:20px;max-width:400px;background:#06172a;border:1px solid #08aaff;border-radius:15px;font-size:22px}
#splash{position:fixed;inset:0;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center}
#splash img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>

<div id="splash"><img src="hima_store_transparent.png"></div>

<div id="status">جاري كشف السوفت وتشغيل التعديلة...</div>

<script>
const ua = navigator.userAgent;
let fw = "1202";
const m = ua.match(/PlayStation 4.*?(\d+\.\d+)/) || ua.match(/(\d+\.\d+)/);
if(m){ fw = m[1].replace('.',''); }
document.getElementById('status').innerHTML = `تم كشف سوفت ${fw} <br><br> جاري تحميل الكاش...`;

setTimeout(()=>{
  document.getElementById('splash').style.display='none';
  document.getElementById('status').innerHTML += `<br>✅ تم تحميل الكاش`;
},15000);
</script>

</body>
</html>
